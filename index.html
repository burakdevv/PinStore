<script>
/* =============================
   PINSTORE — SUPABASE CONFIG
   GitHub Pages'te yalnızca publishable/anon key kullan.
   service_role anahtarını asla buraya koyma.
   ============================= */
const SUPABASE_URL = 'https://lytzjcvtrvhkpkbxgfhh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KWTsl21bvFbm3y7XqYMF8A_hs7llfKz';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const IMG = {
  pubgm: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA2Y5R9JwTKX4uNDSH0jECwr4b3JxkEaNCUu-aSubhKQ&s=10',
  random: 'https://assets.hyperteknoloji.com/cdn/sonteklif/ilan-category/dpubgrandomhesaplar_d8ef88f1461e9cc851e7d77153fb41f4.jpg',
  logo: 'https://img.magnific.com/premium-vector/pin-store-logo-template-design_316488-1646.jpg?semt=ais_hybrid&w=740&q=80'
};
const FEE_RATE = 13.951567;
let session = null, profile = null, realtime = [], currentConversation = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n||0));
const toast=(msg,type='')=>{const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3600)};
const isConfigured=()=>SUPABASE_URL.includes('.supabase.co') && !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_KEY.includes('YOUR_');
const currentUser=()=>session?.user||null;
const route=()=>location.hash.replace(/^#\/?/,'').split('?')[0]||'mainsite';

async function refreshSession(){const {data}=await sb.auth.getSession();session=data.session; if(session){const r=await sb.from('profiles').select('id,username,display_name,avatar_path,bio,role,account_status,is_verified_seller,rating_avg,rating_count,last_seen_at,created_at').eq('id',session.user.id).maybeSingle();profile=r.data||null;} else profile=null;}
async function init(){document.getElementById('year').textContent=new Date().getFullYear();await refreshSession();sb.auth.onAuthStateChange(async()=>{await refreshSession();render()});window.addEventListener('hashchange',render);render();}
function layout(title,body){document.title=title+' — PinStore';return `<div class="page"><div class="container">${body}</div></div>`}
function guard(){if(!currentUser()){location.hash='/auth';toast('Bu işlem için giriş yapmalısın.','err');return false}return true}

function home(){return `<section class="hero"><div class="container hero-grid"><div><span class="eyebrow"><span class="dot"></span> PUBG MOBILE ACCOUNT MARKET</span><h1>Hesabını <span class="gradient">bul.</span><br>Sat. Kirala.</h1><p>PinStore, PUBG Mobile hesaplarını tek yerde keşfetmek, satmak ve kiralamak için tasarlanmış premium marketplace arayüzüdür. Gerçek kullanıcı hesabı, Supabase Auth, RLS ve Realtime chat ile çalışır.</p><div class="hero-cta"><a class="btn primary" href="#/pubgmaccounts">Hesapları Keşfet →</a><a class="btn" href="#/pubgmforrentaccounts">Kiralık Hesaplar</a><a class="btn" href="#/pubgmforsaleaccounts">Satılık Hesaplar</a></div><div class="stats"><div class="stat"><b>2+2</b><span>Görsel / Video</span></div><div class="stat"><b>24/7</b><span>Marketplace</span></div><div class="stat"><b>Realtime</b><span>Chat</span></div></div></div><div class="hero-media"><img src="${IMG.pubgm}" alt="PUBG Mobile" loading="eager"><div class="hero-caption"><small>PINSTORE ORIGINAL MARKET</small><strong>PUBG Mobile Accounts</strong></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><h2>Öne çıkan PUBG Mobile</h2><p>Onaylanan hesaplar burada listelenir.</p></div><a class="btn" href="#/salesfullmarketplace">Tüm marketplace</a></div><div id="featured" class="cards"><div class="empty">Hesaplar yükleniyor...</div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><h2>PinStore sistemi</h2><p>SQL backend'in mevcut özelliklerine göre hazırlanmıştır.</p></div></div><div class="feature-grid"><div class="feature"><div class="icon">⌁</div><h3>Gerçek Chat</h3><p>Supabase Realtime ile mesajlar sayfa yenilenmeden güncellenir. Konuşmalar mevcut conversations/messages tablolarına bağlıdır.</p></div><div class="feature"><div class="icon">✓</div><h3>Admin Onayı</h3><p>Hesap başvurusu RPC ile oluşturulur; admin onayından sonra account_listings tarafında yayınlanır.</p></div><div class="feature"><div class="icon">₺</div><h3>Şeffaf Fiyat</h3><p>97.000 TL örneğinde SQL'in %13,951567 oranı ile müşteri fiyatı 110.533,02 TL olarak hesaplanır.</p></div></div></div></section>`}

async function loadFeatured(){const el=document.getElementById('featured');if(!el)return;const {data,error}=await sb.from('account_listings').select('id,title,game_name,description,price,currency,status,seller_id,created_at').eq('status','active').order('created_at',{ascending:false}).limit(6);if(error){el.innerHTML='<div class="empty">Marketplace verisi okunamadı.</div>';return}if(!data?.length){el.innerHTML='<div class="empty">Henüz onaylanmış PUBG Mobile hesabı yok.</div>';return}el.innerHTML=data.map(accountCard).join('')}
function accountCard(a){return `<article class="card"><div class="card-media"><img src="${IMG.pubgm}" alt="PUBG Mobile" loading="lazy"><span class="pill">PUBGM · ${a.status==='active'?'AKTİF':'PASİF'}</span></div><div class="card-body"><h3>${esc(a.title)}</h3><div class="card-meta"><span>${esc(a.game_name||'PUBG Mobile')}</span><span>${new Date(a.created_at).toLocaleDateString('tr-TR')}</span></div><div class="price">${money(a.price)} <small>TRY</small></div><div class="card-actions"><button class="btn" onclick="openAccount('${a.id}')">İncele</button><button class="btn primary" onclick="startAccountChat('${a.seller_id}')">Satıcıya Yaz</button></div></div></article>`}

async function marketplace(filter='all'){let q=sb.from('account_listings').select('id,title,game_name,description,price,currency,status,seller_id,created_at').eq('status','active').order('created_at',{ascending:false});const {data,error}=await q.limit(60);return layout('PUBGM Marketplace',`<div class="section-head"><div><h1>PUBG Mobile Marketplace</h1><p class="page-intro">${filter==='rent'?'Kiralık hesaplar':filter==='sale'?'Satılık hesaplar':'Onaylı PUBG Mobile hesapları'}.</p></div><div class="search"><input id="marketSearch" placeholder="Hesap ara..." oninput="filterCards()"></div></div><div id="marketCards" class="cards">${error?'<div class="empty">Veri okunamadı.</div>':data?.length?data.map(accountCard).join(''):'<div class="empty">Henüz ilan yok.</div>'}</div>`)}
function filterCards(){const q=(document.getElementById('marketSearch')?.value||'').toLowerCase();document.querySelectorAll('#marketCards .card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'':'none')}
async function openAccount(id){const {data,error}=await sb.from('account_listings').select('id,title,game_name,description,price,currency,status,seller_id,created_at,submission_id').eq('id',id).maybeSingle();if(error||!data){toast('İlan bulunamadı.','err');return}openModal(`<h2>${esc(data.title)}</h2><p class="muted">${esc(data.game_name)}</p><img src="${IMG.pubgm}" style="width:100%;aspect-ratio:1440/881;object-fit:cover;border-radius:15px;margin:12px 0"><div class="price">${money(data.price)}</div><p class="muted" style="line-height:1.7">${esc(data.description||'Açıklama eklenmemiş.')}</p><div class="notice">Hesap login bilgileri public ilanda gösterilmez. Güvenli teslim akışı backend/secret katmanında tutulmalıdır.</div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" onclick="startAccountChat('${data.seller_id}');closeModal()">Satıcıya mesaj gönder</button><button class="btn" onclick="closeModal()">Kapat</button></div>`)}

function authPage(){return `<div class="auth"><div class="auth-card"><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Giriş</button><button id="registerTab" onclick="authMode('register')">Kayıt</button></div><div id="authBox"></div></div></div>`}
function authMode(mode){const b=document.getElementById('authBox');if(!b)return;document.getElementById('loginTab').classList.toggle('active',mode==='login');document.getElementById('registerTab').classList.toggle('active',mode==='register');b.innerHTML=mode==='login'?`<h1>PinStore'a giriş</h1><p class="muted">Hesabınla marketplace ve chat'e devam et.</p><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>Şifre</label><input id="authPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">Giriş Yap</button><p class="muted" style="font-size:12px;margin-top:12px">Şifren Supabase Auth tarafından yönetilir; public profilde saklanmaz.</p>`:`<h1>Hesap oluştur</h1><p class="muted">Email + şifre ile kayıt ol.</p><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>Şifre</label><input id="authPass" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Kullanıcı adı</label><input id="authUser" maxlength="40"></div><button class="btn primary" style="width:100%" onclick="register()">Kayıt Ol</button>`}
async function login(){if(!isConfigured()){toast('Önce SUPABASE_URL ve SUPABASE_KEY değerlerini index.html içinde doldur.','err');return}const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){toast(error.message,'err');return}toast('Giriş başarılı.','ok');location.hash='/mainsite'}
async function register(){if(!isConfigured()){toast('Önce Supabase ayarlarını doldur.','err');return}const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value,username=document.getElementById('authUser').value.trim();const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username}}});if(error){toast(error.message,'err');return}toast(data.session?'Hesap oluşturuldu.':'Email doğrulaması gerekiyorsa gelen kutunu kontrol et.','ok');location.hash='/mainsite'}

function submitPage(){if(!guard())return '';return layout('Hesap Ekle',`<h1>Hesap gönder</h1><p class="page-intro">PUBG Mobile hesabını admin incelemesine gönder. SQL tarafında hesap talebi ve admin bildirimi otomatik oluşturulur.</p><div class="panel"><div class="notice">Güvenlik: Bu mevcut SQL RPC'si plaintext hesap şifresi almıyor. Login email ve görünen hesap adı alınır; gerçek parola için ayrıca Vault/secret teslim katmanı kurulmalıdır.</div><div class="grid2" style="margin-top:16px"><div class="field"><label>Hesap adı</label><input id="subName" maxlength="160" placeholder="Bape full 92 Koleksiyon PUBG Mobile Account"></div><div class="field"><label>Oyun</label><input id="subGame" value="PUBG Mobile" readonly></div></div><div class="field"><label>Açıklama</label><textarea id="subDesc" maxlength="5000" placeholder="Hesabın koleksiyonu, rank, skin bilgileri..."></textarea></div><div class="grid2"><div class="field"><label>Satıcı taban fiyatı (TL)</label><input id="subPrice" type="number" min="1" step="0.01" oninput="calcSubmit()" placeholder="97000"></div><div class="field"><label>Hesap login email</label><input id="subEmail" type="email" placeholder="hesap@example.com"></div></div><div class="field"><label>Hesap görünen adı</label><input id="subDisplay" maxlength="160" placeholder="PUBGM Account"></div><div class="calc"><div class="calc-row"><span>Platform oranı</span><strong>%${FEE_RATE}</strong></div><div class="calc-row"><span>Satıcı payout</span><strong id="sellerPayout">₺0,00</strong></div><div class="calc-row"><span>Platform brüt farkı</span><strong id="platformFee">₺0,00</strong></div><div class="calc-row calc-total"><span>Müşteri fiyatı</span><strong id="customerPrice">₺0,00</strong></div></div><button class="btn primary" onclick="submitAccount()">Admin incelemesine gönder →</button></div>`)}
function calcSubmit(){const p=Number(document.getElementById('subPrice')?.value||0),customer=Math.round(p*(1+FEE_RATE/100)*100)/100,fee=Math.round((customer-p)*100)/100;document.getElementById('sellerPayout').textContent=money(p);document.getElementById('platformFee').textContent=money(fee);document.getElementById('customerPrice').textContent=money(customer)}
async function submitAccount(){const account_name=document.getElementById('subName').value.trim(),game_name='PUBG Mobile',description=document.getElementById('subDesc').value.trim(),base_price=Number(document.getElementById('subPrice').value),login_email=document.getElementById('subEmail').value.trim(),display_name=document.getElementById('subDisplay').value.trim();if(!account_name||!login_email||!base_price){toast('Hesap adı, email ve fiyat zorunlu.','err');return}const {data,error}=await sb.rpc('submit_account_for_review',{p_account_name:account_name,p_game_name:game_name,p_description:description,p_base_price:base_price,p_login_email:login_email,p_display_name:display_name||null});if(error){toast(error.message,'err');return}openModal(`<h2>Talep gönderildi ✓</h2><p class="muted">Admin incelemesi başladı.</p><div class="calc"><div class="calc-row"><span>Talep ID</span><strong>${esc(data.request_id)}</strong></div><div class="calc-row"><span>Satıcı payout</span><strong>${money(data.seller_payout)}</strong></div><div class="calc-row"><span>Müşteri fiyatı</span><strong>${money(data.customer_price)}</strong></div><div class="calc-row"><span>Platform farkı</span><strong>${money(data.platform_fee)}</strong></div></div><button class="btn primary" onclick="closeModal();location.hash='/mails'">Taleplerime git</button>`);}

async function mySubmissions(){if(!guard())return '';const {data,error}=await sb.from('account_submissions').select('id,request_id,account_name,game_name,base_price,fee_rate,customer_price,seller_payout,platform_fee,status,admin_note,created_at').eq('seller_id',currentUser().id).order('created_at',{ascending:false});return layout('Hesap Taleplerim',`<div class="section-head"><div><h1>Hesap taleplerim</h1><p class="page-intro">Admin inceleme durumlarını burada takip et.</p></div><a class="btn primary" href="#/submit-account">+ Hesap Ekle</a></div><div class="panel">${error?'<div class="empty">Talepler okunamadı.</div>':data?.length?`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Talep</th><th>Hesap</th><th>Satıcı fiyatı</th><th>Müşteri</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>${data.map(s=>`<tr><td>${esc(s.request_id)}</td><td>${esc(s.account_name)}</td><td>${money(s.base_price)}</td><td>${money(s.customer_price)}</td><td><span class="badge ${s.status}">${esc(s.status)}</span></td><td>${new Date(s.created_at).toLocaleString('tr-TR')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz talep yok.</div>'}</div>`)}

async function chats(){if(!guard())return '';const {data,error}=await sb.from('conversations').select('id,listing_id,buyer_id,seller_id,status,last_message_at,last_message_preview,buyer_unread_count,seller_unread_count,created_at').or(`buyer_id.eq.${currentUser().id},seller_id.eq.${currentUser().id}`).order('last_message_at',{ascending:false});window.chatRows=data||[];return layout('Mesajlar',`<h1>Mesajlar</h1><p class="page-intro">Supabase Realtime bağlı gerçek konuşmalar.</p><div class="chat-layout"><aside class="chat-list"><div class="chat-list-head"><strong>Konuşmalar</strong></div><div id="chatList">${error?'<div class="empty">Chat okunamadı.</div>':(data||[]).length?data.map(chatRow).join(''):'<div class="empty" style="margin:12px">Henüz konuşma yok. Marketplace'ten bir satıcıya yaz.</div>'}</div></aside><section class="chat-main"><div class="chat-head"><strong id="chatTitle">Bir konuşma seç</strong><span class="muted" id="chatStatus">Realtime hazır</span></div><div class="messages" id="messages"><div class="empty">Soldan bir konuşma seç.</div></div><div class="chat-compose"><input id="messageInput" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn primary" onclick="sendMessage()">Gönder</button></div></section></div>`)}
function chatRow(c){const mine=c.buyer_id===currentUser().id,unread=mine?c.buyer_unread_count:c.seller_unread_count;return `<div class="chat-item" id="chat-${c.id}" onclick="selectChat('${c.id}')"><strong>${mine?'Satıcıyla konuşma':'Alıcıyla konuşma'} ${unread?`<span class="badge" style="float:right">${unread}</span>`:''}</strong><span>${esc(c.last_message_preview||'Yeni konuşma')} · ${new Date(c.last_message_at).toLocaleString('tr-TR')}</span></div>`}
async function selectChat(id){currentConversation=(window.chatRows||[]).find(x=>x.id===id);if(!currentConversation)return;document.querySelectorAll('.chat-item').forEach(x=>x.classList.remove('active'));document.getElementById('chat-'+id)?.classList.add('active');document.getElementById('chatTitle').textContent=currentConversation.buyer_id===currentUser().id?'Satıcıyla konuşma':'Alıcıyla konuşma';await loadMessages();await sb.rpc('mark_conversation_read',{p_conversation_id:id});subscribeMessages(id)}
async function loadMessages(){const {data,error}=await sb.from('messages').select('id,conversation_id,sender_id,message_type,body,created_at,read_at,deleted_at').eq('conversation_id',currentConversation.id).order('created_at',{ascending:true});const box=document.getElementById('messages');if(error){box.innerHTML='<div class="empty">Mesajlar okunamadı.</div>';return}box.innerHTML=(data||[]).map(messageBubble).join('')||'<div class="empty">İlk mesajı gönder.</div>';box.scrollTop=box.scrollHeight}
function messageBubble(m){return `<div class="bubble ${m.sender_id===currentUser().id?'mine':''}">${m.deleted_at?'[Mesaj silindi]':esc(m.body||'')}<small>${new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small></div>`}
function subscribeMessages(id){realtime.forEach(x=>sb.removeChannel(x));realtime=[];const ch=sb.channel('chat-'+id).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`},()=>loadMessages());ch.subscribe();realtime.push(ch)}
async function sendMessage(){if(!currentConversation)return toast('Önce bir konuşma seç.','err');const body=document.getElementById('messageInput').value.trim();if(!body)return;const {error}=await sb.from('messages').insert({conversation_id:currentConversation.id,sender_id:currentUser().id,message_type:'text',body,client_message_id:crypto.randomUUID()});if(error){toast(error.message,'err');return}document.getElementById('messageInput').value='';await loadMessages()}
async function startAccountChat(sellerId){if(!guard())return;if(sellerId===currentUser().id){toast('Kendi hesabına mesaj gönderemezsin.','err');return}let {data,error}=await sb.from('conversations').select('*').eq('buyer_id',currentUser().id).eq('seller_id',sellerId).is('listing_id',null).maybeSingle();if(error){toast(error.message,'err');return}if(!data){const r=await sb.from('conversations').insert({listing_id:null,buyer_id:currentUser().id,seller_id:sellerId}).select().single();if(r.error){toast(r.error.message,'err');return}data=r.data}location.hash='/chat';setTimeout(()=>selectChat(data.id),700)}

async function adminPage(){if(!guard())return '';if(profile?.role!=='admin'){return layout('Yetkisiz',`<div class="empty"><h2>Admin yetkisi gerekli</h2><p>Bu alan yalnızca admin rolündeki kullanıcılar içindir.</p></div>`)}const [reqs,subs]=await Promise.all([sb.from('admin_account_requests').select('id,submission_id,event_type,message,is_read,created_at').order('created_at',{ascending:false}).limit(50),sb.from('account_submissions').select('id,request_id,account_name,game_name,base_price,customer_price,platform_fee,status,seller_id,admin_note,created_at').order('created_at',{ascending:false}).limit(100)]);window.adminSubs=subs.data||[];return layout('Admin Panel',`<div class="section-head"><div><h1>Admin Console</h1><p class="page-intro">Realtime hesap talepleri ve onay merkezi.</p></div><span class="eyebrow"><span class="dot"></span> ADMIN ONLINE</span></div><div class="admin-stat-grid"><div class="admin-stat"><b>${(subs.data||[]).filter(x=>x.status==='pending').length}</b><span>Bekleyen</span></div><div class="admin-stat"><b>${(subs.data||[]).filter(x=>x.status==='approved').length}</b><span>Onaylanan</span></div><div class="admin-stat"><b>${(reqs.data||[]).filter(x=>!x.is_read).length}</b><span>Yeni bildirim</span></div><div class="admin-stat"><b>${(subs.data||[]).length}</b><span>Toplam talep</span></div></div><div class="panel"><h3>Hesap talepleri</h3><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Talep</th><th>Hesap</th><th>Fiyat</th><th>Müşteri</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${(subs.data||[]).map(s=>`<tr><td>${esc(s.request_id)}</td><td><strong>${esc(s.account_name)}</strong><br><span class="muted">${esc(s.game_name)}</span></td><td>${money(s.base_price)}</td><td>${money(s.customer_price)}</td><td><span class="badge ${s.status}">${esc(s.status)}</span></td><td>${s.status==='pending'?`<button class="btn green" onclick="approveAccount('${s.id}')">Onayla</button> <button class="btn danger" onclick="rejectAccount('${s.id}')">Reddet</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">Talep yok.</td></tr>'}</tbody></table></div></div><div class="panel" style="margin-top:16px"><h3>Realtime bildirim kuyruğu</h3>${(reqs.data||[]).map(r=>`<div style="padding:11px 0;border-bottom:1px solid #1b2330"><span class="badge ${r.is_read?'':'pending'}">${r.is_read?'ok':'new'}</span> ${esc(r.message)} <span class="muted">${new Date(r.created_at).toLocaleString('tr-TR')}</span></div>`).join('')||'<div class="empty">Bildirim yok.</div>'}</div>`)}
async function approveAccount(id){const note=prompt('Admin notu (opsiyonel):')??null;const {error}=await sb.rpc('admin_approve_account',{p_submission_id:id,p_note:note});if(error){toast(error.message,'err');return}toast('Hesap onaylandı ve katalog kaydı oluşturuldu.','ok');render()}
async function rejectAccount(id){const note=prompt('Red nedeni:')||'Admin tarafından reddedildi';const {error}=await sb.rpc('admin_reject_account',{p_submission_id:id,p_note:note});if(error){toast(error.message,'err');return}toast('Talep reddedildi.','ok');render()}
function globalChat(){return layout('Global Chat',`<h1>Global Chat</h1><p class="page-intro">Mevcut SQL şeması birebir 1:1 conversations modeli kullanıyor. Bu yüzden gerçek global oda yerine gerçek kullanıcı-satıcı konuşmalarına yönlendiriyoruz.</p><div class="panel"><div class="notice">Global topluluk odası için SQL'e ayrı bir room/messages modeli eklemek gerekir. Mevcut backend ile çalışan gerçek chat için marketplace'ten satıcıya mesaj gönder.</div><div style="margin-top:15px"><a class="btn primary" href="#/pubgmaccounts">Hesap seç ve chat başlat →</a></div></div>`)}
function simplePage(title,text,actions=''){return layout(title,`<h1>${title}</h1><p class="page-intro">${text}</p><div class="panel"><p class="muted" style="line-height:1.7">PinStore'un PUBG Mobile odaklı marketplace arayüzü. Bu sayfa mevcut Supabase backend'ine göre hazırlanmıştır.</p>${actions}</div>`)}
function helpPage(){return layout('Yardım',`<h1>Yardım Merkezi</h1><p class="page-intro">Hesap, ilan, chat ve admin onayı hakkında.</p><div class="feature-grid"><div class="feature"><h3>Hesap nasıl alınır?</h3><p>Marketplace'ten PUBG Mobile ilanını aç, detayları incele ve satıcıya chat üzerinden ulaş.</p></div><div class="feature"><h3>Hesap nasıl satılır?</h3><p>Giriş yaptıktan sonra Hesap Ekle akışından talep gönder. Admin onayından sonra katalogda görünür.</p></div><div class="feature"><h3>Şifre güvenliği</h3><p>Mevcut SQL plaintext parola alanı kullanmıyor. Gerçek parola teslimi için güvenli secret/Vault katmanı kullanılmalı.</p></div></div>`)}
function profilePage(){if(!guard())return '';return layout('Profil',`<h1>Profil</h1><p class="page-intro">${esc(profile?.username||currentUser().email||'Kullanıcı')}</p><div class="panel"><div class="grid2"><div class="field"><label>Kullanıcı adı</label><input id="profileUsername" value="${esc(profile?.username||'')}" disabled></div><div class="field"><label>Rol</label><input value="${esc(profile?.role||'user')}" disabled></div></div><div class="field"><label>Görünen ad</label><input id="profileDisplay" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>Biyografi</label><textarea id="profileBio">${esc(profile?.bio||'')}</textarea></div><button class="btn primary" onclick="saveProfile()">Profili kaydet</button> <button class="btn" onclick="logout()">Çıkış</button></div>`)}
async function saveProfile(){const {error}=await sb.from('profiles').update({display_name:document.getElementById('profileDisplay').value.trim(),bio:document.getElementById('profileBio').value.trim()}).eq('id',currentUser().id);if(error){toast(error.message,'err');return}await refreshSession();toast('Profil güncellendi.','ok');render()}
async function logout(){await sb.auth.signOut();location.hash='/mainsite';toast('Çıkış yapıldı.','ok')}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function toggleMobileNav(){document.getElementById('navlinks').style.display=document.getElementById('navlinks').style.display==='flex'?'':'flex'}

async function render(){const r=route();let html='';try{if(r==='mainsite'||r==='')html=home();else if(r==='auth'){html=authPage()}else if(r==='pubgmaccounts'||r==='salesfullmarketplace')html=await marketplace('all');else if(r==='pubgmforsaleaccounts')html=await marketplace('sale');else if(r==='pubgmforrentaccounts')html=await marketplace('rent');else if(r==='randomaccounts')html=layout('PUBGM Random Accounts',`<h1>Random PUBG Mobile</h1><p class="page-intro">Sadece PUBG Mobile random hesap kategorisi.</p><div class="cards"><article class="card"><div class="card-media"><img src="${IMG.random}" alt="PUBGM random hesap"></div><div class="card-body"><h3>PUBGM Random Hesaplar</h3><p class="muted">Random hesap ilanlarını burada listele.</p><div class="card-actions"><a class="btn primary" href="#/pubgmaccounts">Marketplace'e git</a></div></div></article></div>`);else if(r==='submit-account')html=submitPage();else if(r==='mails')html=layout('Satılık Mailler',`<h1>Satılık Mailler</h1><p class="page-intro">Bu route hazırdır; ancak mevcut SQL şemasında ayrı bir mail-listings tablosu bulunmuyor. Bu yüzden burada sahte ilan üretmiyoruz.</p><div class="panel"><div class="notice">Gerçek mail marketplace'i eklemek için ayrı bir ürün tablosu + RLS + moderasyon modeli gerekir. Mevcut backend ile hesap başvurularını görmek için <a href="#/seller-requests" style="text-decoration:underline">Hesap Taleplerim</a> bölümünü kullan.</div></div>`);else if(r==='seller-requests')html=await mySubmissions();else if(r==='chat')html=await chats();else if(r==='globalchat')html=globalChat();else if(r==='admins')html=await adminPage();else if(r==='help')html=helpPage();else if(r==='supportwhatsapp')html=simplePage('WhatsApp Destek','WhatsApp numaranı HTML içindeki SUPPORT_WHATSAPP değişkenine ekleyerek canlı destek butonunu aktifleştir.','<button class="btn primary" onclick="openWhatsApp()">WhatsApp\'ı aç</button>');else if(r==='profile')html=profilePage();else html=simplePage('Sayfa bulunamadı','Bu route mevcut değil.');document.getElementById('app').innerHTML=html;if(r==='mainsite'||r==='')loadFeatured();if(r==='auth')authMode('login');if(r==='chat'&&currentConversation)setTimeout(()=>selectChat(currentConversation.id),100);subscribeAdminRealtime();}catch(e){console.error(e);document.getElementById('app').innerHTML=layout('Hata',`<div class="empty"><h2>Bir hata oluştu</h2><p>${esc(e.message||e)}</p></div>`)}}
let adminChannel=null;function subscribeAdminRealtime(){if(adminChannel)sb.removeChannel(adminChannel);if(profile?.role!=='admin')return;adminChannel=sb.channel('admin-account-requests').on('postgres_changes',{event:'*',schema:'public',table:'admin_account_requests'},payload=>{toast('Yeni admin hesap bildirimi geldi.','ok');if(route()==='admins')render()}).subscribe()}
function openWhatsApp(){const number='';if(!number){toast('SUPPORT_WHATSAPP numarasını kodda tanımla.','err');return}window.open('https://wa.me/'+number.replace(/\D/g,''),'_blank','noopener')}

init();
</script>
</body>
</html>
